<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3352D6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC 650">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Sổ tay TOEIC 650</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans:wght@400;500&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; full-screen practice sessions with OMR answer bubbles.
   Listening = teal, Reading = amber, accent = exam-booklet blue. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface2:#EDF0F6; --ink:#141B2D; --muted:#5B6478; --line:#DFE4EE;
  --accent:#3352D6; --on-accent:#FFFFFF; --accent-soft:#E6EBFC;
  --listen:#0E8276; --listen-soft:#DDF2EF; --read:#A65F00; --read-soft:#FBEBD3;
  --ok:#17844F; --ok-soft:#DFF3E8; --bad:#C93838; --bad-soft:#FBE4E4; --mark:#FFE9A8; --mark-ink:#574300;
  --adv:#7A3FC2; --adv-soft:#EFE6FB;
  --heat0:#E3E8F1;
  --f-body:"Be Vietnam Pro", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-ipa:"Noto Sans", "Segoe UI", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161D2E; --surface2:#1C2437; --ink:#E8ECF6; --muted:#98A3BA; --line:#283249;
  --accent:#8FA6FF; --on-accent:#0D1220; --accent-soft:#222D4D;
  --listen:#4FD1C1; --listen-soft:#143532; --read:#F0B04F; --read-soft:#3A2C14;
  --ok:#4CC98C; --ok-soft:#15352A; --bad:#F28585; --bad-soft:#3B1F24; --mark:#4A3F12; --mark-ink:#F6DC86;
  --adv:#C9A2FF; --adv-soft:#2E2347; --heat0:#222B40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D2E; --surface2:#1C2437; --ink:#E8ECF6; --muted:#98A3BA; --line:#283249;
  --accent:#8FA6FF; --on-accent:#0D1220; --accent-soft:#222D4D;
  --listen:#4FD1C1; --listen-soft:#143532; --read:#F0B04F; --read-soft:#3A2C14;
  --ok:#4CC98C; --ok-soft:#15352A; --bad:#F28585; --bad-soft:#3B1F24; --mark:#4A3F12; --mark-ink:#F6DC86;
  --adv:#C9A2FF; --adv-soft:#2E2347; --heat0:#222B40; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .c{text-align:center}
.row{display:flex;align-items:center} .between{justify-content:space-between} .gap{gap:8px} .wrap{flex-wrap:wrap} .center{justify-content:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;background:none;border:0;cursor:pointer;text-align:left}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:800 13px var(--f-mono);letter-spacing:-.02em}
.brand b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;font-weight:600;color:var(--muted);text-align:left}
.nav-btn:hover{background:var(--surface2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent)}
.side .streak{margin-top:auto}
.topbar{display:none}
main{min-width:0;padding-inline:28px;padding-block:28px 60px;max-width:960px;width:100%;margin:0 auto}
.bottom{display:none}
.streak{display:inline-flex;align-items:center;gap:6px;font:700 14px var(--f-mono);color:var(--read);background:var(--read-soft);border-radius:999px;padding:6px 12px}
.streak svg{width:16px;height:16px}
@media (max-width:860px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0}
  main{padding-inline:16px;padding-block:18px 110px}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottom .nav-btn{flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;justify-content:center;align-items:center;border-radius:10px}
  .bottom .nav-btn svg{width:22px;height:22px}
  .bottom .nav-btn{position:relative}
  .bottom .nav-btn.on{background:none;color:var(--accent)}
  .bottom .nav-btn.on::before{content:"";position:absolute;top:-6px;left:50%;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);transform:translateX(-50%)}
}

/* ---------- type ---------- */
h1{font-size:clamp(26px,5vw,34px);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;font-weight:800;text-wrap:balance}
.vt{margin-bottom:14px}
.sh{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:26px 0 10px;color:var(--muted);display:flex;align-items:center;gap:8px}
.sh.L::before,.sh.R::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--listen)}
.sh.R::before{background:var(--read)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 4px}
.eyebrow.light{color:inherit;opacity:.8}
.lead{color:var(--muted);margin:0 0 12px}
.ipa{font-family:var(--f-ipa);color:var(--accent)}
.ipa.big{font-size:20px}
.pos{font:12px var(--f-mono);color:var(--muted)}
code{font-family:var(--f-mono);font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:6px;overflow-wrap:anywhere}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07);color:var(--on-accent)}
.btn.pri:disabled{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.big{min-height:50px;padding:12px 22px;font-size:16px;flex:1;max-width:340px}
.btn.sm{min-height:34px;padding:5px 12px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.btn.bad-o{border-color:var(--bad);color:var(--bad)} .btn.ok-o{border-color:var(--ok);color:var(--ok)}
.btn.bad-o:hover{background:var(--bad-soft)} .btn.ok-o:hover{background:var(--ok-soft)}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer}
.icon-btn.spk{color:var(--accent);background:var(--accent-soft)}
.icon-btn.sm{width:34px;height:34px;border-radius:10px}
.chip,.rate-chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.rate-chip{font-family:var(--f-mono)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,27,45,.12)}
.seg.sm{margin:0}.seg.sm button{padding:4px 10px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:14px;min-width:0}
.card-h{font-weight:700;margin-bottom:10px}
.card p{margin:0 0 8px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px}
.hero p{margin:0}
.hero-r{display:flex;align-items:center;gap:18px}
.today-ring{position:relative;width:128px;height:128px;flex:none}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-txt b{font:700 30px/1 var(--f-mono)} .ring-txt span{font-size:12px;color:var(--muted)}
.ring .ring-bg{stroke:var(--surface2);fill:none} .ring .ring-fg{stroke:var(--accent);fill:none;stroke-linecap:round;transition:stroke-dashoffset .6s}
.mini-stats{display:grid;gap:8px}
.mini-stats div{display:flex;align-items:baseline;gap:8px}
.mini-stats b{font:700 20px var(--f-mono);min-width:44px;text-align:right}
.mini-stats span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero-r{justify-content:space-between}}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-top:14px;padding:18px 20px;border:0;border-radius:20px;background:var(--accent);color:var(--on-accent);text-align:left;cursor:pointer}
.cta b{display:block;font-size:20px;font-weight:800;margin:2px 0}
.cta span{font-size:13px;opacity:.9}
.cta-go{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb, var(--on-accent) 18%, transparent);display:grid;place-items:center;flex:none}
.cta:hover .cta-go{transform:translateX(3px)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.quick.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:18px}
@media (max-width:760px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:84px}
.qcard b{font-size:15px} .qcard span{font-size:12.5px;color:var(--muted)}
.qcard:hover{border-color:var(--accent)}
.qcard.adv{background:var(--adv-soft);border-color:transparent} .qcard.adv b{color:var(--adv)}
.weak{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.weak:first-of-type{border-top:0}
.weak b{display:block}

/* ---------- parts ---------- */
.parts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.parts{grid-template-columns:minmax(0,1fr)}}
.part{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer}
.part:hover{border-color:var(--accent)}
.pn{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 22px var(--f-mono)}
.part.L .pn{background:var(--listen-soft);color:var(--listen)} .part.R .pn{background:var(--read-soft);color:var(--read)}
.pbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.pbody .muted{font-size:12.5px}
.pbar{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.pbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.part.L .pbar span{background:var(--listen)} .part.R .pbar span{background:var(--read)}
.pgo{color:var(--muted)}

/* ---------- grammar ---------- */
.tips ol,.steps{margin:0;padding-left:20px} .tips li,.steps li{margin-bottom:6px}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tcard.open{border-color:var(--accent)}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:14px 16px;border:0;background:none;cursor:pointer;text-align:left}
.t-meta{font:12px var(--f-mono);color:var(--muted);white-space:nowrap}
.t-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}
.t-body p{margin:0}
.forms{display:grid;gap:6px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.forms div{display:flex;gap:10px;align-items:center;min-width:0}
.fk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--surface);font:700 14px var(--f-mono);flex:none}
.sig{background:var(--mark);color:var(--mark-ink);padding:1px 6px;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.ex{color:var(--muted)} .ex em,.t-body em{font-style:normal;background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:4px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.rule{display:flex;flex-direction:column;gap:4px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;min-width:0}
.callout{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;border-radius:12px;padding:10px 12px;font-size:14px}
.callout.sig{background:var(--mark);color:var(--mark-ink)} .callout.trap{background:var(--bad-soft)} .callout.trap b{color:var(--bad)}

/* ---------- vocab / pron ---------- */
.known{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.known .pbar span{background:var(--ok)}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
.gchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.gchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.actions3,.actions2{display:grid;gap:10px;margin-top:12px}
.actions3{grid-template-columns:repeat(3,minmax(0,1fr))} .actions2{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.actions3{grid-template-columns:minmax(0,1fr)}.actions2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.act:hover{border-color:var(--accent)} .act span{font:12px var(--f-mono);color:var(--muted)}
.vlist{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow.known b{color:var(--ok)}
.vmain{min-width:0} .vm{font-size:14px}
.kn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.kn input{width:18px;height:18px;accent-color:var(--ok)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.split .card{margin-top:12px}
.sounds{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.sounds .card{margin-top:0}
.snd-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.snd p{font-size:14px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wchip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:14px;cursor:pointer}
.wchip:hover{border-color:var(--accent);color:var(--accent)}
.wchip.pair{background:var(--accent-soft);border-color:transparent}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:12.5px;color:var(--muted)} .tile b{font:700 18px var(--f-mono);font-variant-numeric:tabular-nums}
.chart-wrap{position:relative}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;opacity:.5}
.chart .goal{stroke:var(--read);stroke-width:1.5;stroke-dasharray:4 4}
.chart .goal-t{fill:var(--read)}
.chart .axis,.heat .axis{fill:var(--muted);font:11px var(--f-mono);stroke:none}
.chart .axis.strong{fill:var(--ink);font-weight:700}
.chart .bar{fill:var(--accent);opacity:.55;stroke:none}
.chart .bar.today{opacity:1}
.chart .hit{fill:transparent;stroke:none;cursor:pointer}
.chart .hit.act{fill:var(--accent-soft);opacity:.5}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;display:flex;flex-direction:column;gap:1px;pointer-events:none;white-space:nowrap;z-index:2}
.tip b{font-family:var(--f-mono)}
.heat-wrap{overflow-x:auto;padding-bottom:4px}
.heat{display:block}
.hc{stroke:none} .hc.l0{fill:var(--heat0)}
.hc.l1{fill:color-mix(in srgb, var(--accent) 30%, var(--surface))}
.hc.l2{fill:color-mix(in srgb, var(--accent) 52%, var(--surface))}
.hc.l3{fill:color-mix(in srgb, var(--accent) 76%, var(--surface))}
.hc.l4{fill:var(--accent)}
.legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.l0{background:var(--heat0)} .legend i.l1{background:color-mix(in srgb, var(--accent) 30%, var(--surface))} .legend i.l2{background:color-mix(in srgb, var(--accent) 52%, var(--surface))} .legend i.l3{background:color-mix(in srgb, var(--accent) 76%, var(--surface))} .legend i.l4{background:var(--accent)}
.acc{display:flex;flex-direction:column;gap:9px}
.acc-row{display:grid;grid-template-columns:140px minmax(0,1fr) 44px 88px;gap:10px;align-items:center;font-size:14px}
@media (max-width:520px){.acc-row{grid-template-columns:110px minmax(0,1fr) 40px;}.acc-c{grid-column:2 / -1;margin-top:-6px;font-size:12px}}
.acc-t{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.acc-t span{display:block;height:100%;background:var(--accent);border-radius:99px}
.acc-v{font:700 13px var(--f-mono);text-align:right}
.acc-c{font:12px var(--f-mono)}
.weak-pill{font-style:normal;font-family:var(--f-body);font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-soft);border-radius:99px;padding:1px 7px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.set-row:first-of-type{border-top:0}
.set-row select{font:14px var(--f-body);padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);max-width:100%}
.set-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}

/* ---------- session ---------- */
#session{position:fixed;inset:0;z-index:20;background:var(--bg)}
.ses{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
.ses-top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:820px;width:100%;margin:0 auto}
.ses-mid{flex:1;min-width:0}
.ses-title{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.ses-bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.ses-bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ses-count{font:700 13px var(--f-mono);color:var(--muted)}
.ses-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ses-body{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:8px 24px}
.ses-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);max-width:none}
.ses-foot .btn.big{max-width:340px}
@media (min-width:861px){.ses-foot{padding-inline:calc((100vw - 820px)/2 + 16px)}}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:99px;padding:3px 10px}
.tag.adv{color:var(--adv);background:var(--adv-soft)}
.set-title{margin:0 0 12px;font-size:18px}
.stem{font-size:17px;font-weight:600;margin:0 0 12px;line-height:1.5}
.qn{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--surface2);font:700 13px var(--f-mono);margin-right:8px;vertical-align:1px}
.mq{margin-bottom:18px}
.qwrap{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.qwrap .stem{font-size:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.compact{flex-direction:row;flex-wrap:wrap}
.opts.compact .opt{flex:1 1 140px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 14px;cursor:pointer;font-size:15.5px;min-height:52px;transition:border-color .15s, background .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:700 13px var(--f-mono);color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.ipa-opts .ot{font-family:var(--f-ipa);font-size:20px}
.why{margin-top:10px;padding:11px 14px;border-radius:12px;font-size:14.5px;background:var(--ok-soft);border-left:4px solid var(--ok)}
.why.no{background:var(--bad-soft);border-left-color:var(--bad)}
.why .chip{margin-left:6px}
.player{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:16px}
.play-btn{width:54px;height:54px;border-radius:50%;border:0;background:var(--listen);color:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.play-btn svg{width:24px;height:24px;margin-left:3px}
.play-btn:active{transform:scale(.95)}
.pl-txt{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-txt span{font-size:12.5px;color:var(--muted)}
.scene{background:var(--surface2);border-radius:16px;padding:14px 16px;margin-bottom:14px;border:1px dashed var(--line)}
.scene-k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:4px}
.scene p{margin:0;font-size:16px}
.tr{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.tr p{margin:0}
.sp{font:700 11px var(--f-mono);color:var(--listen);background:var(--listen-soft);border-radius:6px;padding:2px 6px;margin-right:8px;vertical-align:1px}
.trans{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.trans summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--muted)}
.trans p{display:flex;gap:6px;align-items:flex-start;margin:0 0 10px;font-size:14.5px}
.mini-spk{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;cursor:pointer;flex:none}
.mini-spk svg{width:16px;height:16px}
.graphic,.passage{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:15px;min-width:0}
.passage p{margin:0 0 10px} .passage p:last-child{margin-bottom:0}
.doc{padding-bottom:12px;margin-bottom:12px;border-bottom:1px dashed var(--line)}
.doc:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.doc-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--read);margin-bottom:6px}
.blank{font-weight:700;color:var(--read);background:var(--read-soft);border-radius:6px;padding:0 6px;white-space:nowrap}
.blank.filled{color:var(--ok);background:var(--ok-soft);white-space:normal}
.tw{overflow-x:auto}
table.gt{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0;font-variant-numeric:tabular-nums}
table.gt th,table.gt td{border:1px solid var(--line);padding:6px 10px;text-align:left}
table.gt th{background:var(--surface2)}
.inp{width:100%;font:16px var(--f-body);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical;margin-bottom:10px}
.inp:focus{border-color:var(--accent);outline:none}
.diff{margin-top:12px;font-size:17px;line-height:2;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.diff .hit{color:var(--ok);font-weight:600}
.diff .miss{color:var(--bad);background:var(--bad-soft);font-weight:700;padding:1px 5px;border-radius:5px}
.note{font-size:14px;color:var(--muted);margin-top:8px}
.big-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.big-choice{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:26px 10px;font-size:24px;font-weight:700;cursor:pointer}
.big-choice:not(:disabled):hover{border-color:var(--accent)}
.big-choice.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.big-choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.word-hero{display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 0 6px;flex-wrap:wrap}
.word-hero b{font-size:clamp(30px,8vw,42px);font-weight:800;letter-spacing:-.02em}
.word-hero.sm{padding:4px 0}.word-hero.sm b{font-size:26px}
.syl-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:26px 0 12px}
.syl{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:22px;font-weight:700;cursor:pointer;min-width:58px}
.syl:not(:disabled):hover{border-color:var(--accent)}
.syl.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.syl.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.flash{width:100%;min-height:260px;border:1px solid var(--line);background:var(--surface);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;cursor:pointer;text-align:center;margin-bottom:10px}
.fl-w{font-size:clamp(32px,8vw,46px);font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.fl-m{font-size:24px;font-weight:700}
.fl-small{font-size:13px;color:var(--muted)}
.fl-spk{color:var(--accent)}
.done{text-align:center;padding-top:30px}
.done-ring{position:relative;width:132px;height:132px;margin:0 auto 10px}
.done-pct{position:absolute;inset:0;display:grid;place-content:center}
.done-pct b{font:700 30px/1 var(--f-mono)} .done-pct span{font-size:12px;color:var(--muted)}
.h2c{margin:8px 0 2px;font-size:22px}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.stat3 div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column}
.stat3 b{font:700 18px var(--f-mono)} .stat3 span{font-size:12px;color:var(--muted)}
.wl{text-align:left;margin:0;padding-left:18px;font-size:14px} .wl li{margin-bottom:6px}

/* ---------- translation + tap-to-save ---------- */
.trn{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.trn .en{font-size:16px;line-height:1.7}
.trn .vi{font-size:15px;color:var(--ink)}
.vk{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--listen);background:var(--listen-soft);border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.taphint{font-size:12px;color:var(--muted)}
.taphint.top{margin:-4px 0 8px}
.w{border:0;background:none;padding:0 1px;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:4px;border-bottom:1px dotted color-mix(in srgb, var(--muted) 60%, transparent);line-height:inherit}
.w:hover{background:var(--accent-soft);color:var(--accent)}
.w.saved{background:var(--mark);color:var(--mark-ink);border-bottom-color:transparent}
.vi-line{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tr .vi-line{margin:2px 0 0}
.trans p[data-li]{flex-wrap:wrap}
.trans p[data-li] .tl-en{flex:1;min-width:0}
.trans p[data-li] .vi-line{flex-basis:100%;padding-left:34px}
.vi-pass .vi-body{font-size:15px;padding-bottom:10px}
.vi-pass .vi-body p{margin:0 0 8px}
#sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,26,.45)}
.sheet-card{position:relative;width:100%;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:700px){#sheet{align-items:center}.sheet-card{border-radius:20px}}
.sw{font-size:26px;font-weight:800;letter-spacing:-.01em}
.sh-l{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:-4px}
.sheet-card .inp{margin:0}
.sh-ctx{margin:0;font-size:14px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 12px;font-style:italic}
.sh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sh-actions a.btn{text-decoration:none}
.grow{flex:1}
.vrow.mine{align-items:start}
.inp.mm{margin:6px 0 2px;padding:7px 10px;font-size:14px}
.ctx{font-style:italic}
.empty{display:flex;flex-direction:column;gap:4px;padding:18px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}

/* ---------- learning paths ---------- */
.path-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.path-grid{grid-template-columns:minmax(0,1fr)}}
.pcard{--pc:var(--accent);background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.gram,.lessons.gram{--pc:var(--read)} .pcard.listen,.lessons.listen{--pc:var(--listen)} .pcard.vocab,.lessons.vocab{--pc:var(--ok)}
.pcard.wide{margin-bottom:14px}
.pc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pc-name{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--pc)}
.pc-step{font:700 13px var(--f-mono);color:var(--muted)}
.pc-next{display:flex;flex-direction:column;min-height:44px}
.pc-next b{font-size:15.5px;line-height:1.35}
.pcard .pbar{margin-top:0} .pcard .pbar span{background:var(--pc)}
.pc-act{display:flex;gap:6px;flex-wrap:wrap}
.back{padding:0;margin-bottom:10px;font-size:14px}
.lessons{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lnum{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-mono);color:var(--muted)}
.lrow.done .lnum{background:var(--pc);border-color:var(--pc);color:var(--surface)}
.lrow.cur{background:color-mix(in srgb, var(--pc) 8%, var(--surface))}
.lrow.cur .lnum{border-color:var(--pc);color:var(--pc)}
.ltxt{display:flex;flex-direction:column;min-width:0}
.ls-title{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
.lz{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.lz h3{margin:10px 0 2px;font-size:17px}
.lz p{margin:0}
.tips-l{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.pass-card{display:flex;flex-direction:column;gap:2px;text-align:left}
.pass-card.ok{border-color:var(--ok);background:var(--ok-soft)} .pass-card.ok b{color:var(--ok)}
.pass-card.no{border-color:var(--bad);background:var(--bad-soft)} .pass-card.no b{color:var(--bad)}

/* ---------- step-by-step guide + terms ---------- */
.how{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 14px}
.how summary{cursor:pointer;font-weight:700;padding:9px 0;color:var(--accent);font-size:14px}
.how ol,.steps-box ol,.t-how ol{margin:0 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.term{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-weight:600;padding:0 5px;border-radius:5px;cursor:pointer;line-height:inherit}
.term:hover{text-decoration:underline}
.steps-box{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.steps-box ol{margin:0}
.t-def{margin:0 0 8px;font-size:15px}
.t-how{background:var(--surface2);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.t-how b{display:block;margin-bottom:6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.t-how ol{margin:0}
.t-ex{display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--mark);padding:4px 0 4px 12px;margin-bottom:8px;font-size:14.5px}
.t-ex code{background:none;color:var(--ink);padding:0;font-size:13.5px}
.term-card{max-height:85vh}
.term-scroll{overflow-y:auto;min-height:0}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">
  <aside class="side">
    <button class="brand" id="brandHome"><span class="logo">650</span><span><b>Sổ tay TOEIC</b><span>Luyện mỗi ngày</span></span></button>
    <button class="nav-btn" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
    <button class="nav-btn" data-v="parts"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Luyện Part</button>
    <button class="nav-btn" data-v="grammar"><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/></svg>Ngữ pháp</button>
    <button class="nav-btn" data-v="skills"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>Từ & Âm</button>
    <button class="nav-btn" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></svg>Tiến độ</button>

  </aside>
  <div>
    <header class="topbar"><button class="brand" onclick="document.getElementById('brandHome').click()"><span class="logo">650</span><span><b>Sổ tay TOEIC</b></span></button><span class="streak" id="streakChip" title="Số ngày học liên tiếp"></span></header>
    <main id="main"></main>
  </div>
  <nav class="bottom">
    <button class="nav-btn" data-v="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</button>
    <button class="nav-btn" data-v="parts"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>Part</button>
    <button class="nav-btn" data-v="grammar"><svg viewBox="0 0 24 24"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12"/></svg>Ngữ pháp</button>
    <button class="nav-btn" data-v="skills"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/></svg>Từ & Âm</button>
    <button class="nav-btn" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V11M10 20V5M16 20v-6M2 20h20"/></svg>Tiến độ</button>
  </nav>
</div>
<div id="session" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script src="data-grammar.js"></script>
<script src="data-read.js"></script>
<script src="data-listen.js"></script>
<script src="data-vocab.js"></script>
<script src="data-trans.js"></script>

<style>#installBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}#installBar b{font-size:14px}#installBar button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer}#installGo{background:var(--accent);color:var(--on-accent)}#installX{background:transparent;color:var(--bg)}@media (min-width:861px){#installBar{bottom:24px}}</style>
<div id="installBar" hidden><b>Cài Sổ tay TOEIC ra màn hình chính?</b><button id="installGo">Cài app</button><button id="installX" aria-label="Đóng">✕</button></div>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
(function(){var dp=null,bar=document.getElementById("installBar");
addEventListener("beforeinstallprompt",function(e){e.preventDefault();dp=e;if(!matchMedia("(display-mode: standalone)").matches)bar.hidden=false;});
document.getElementById("installGo").onclick=function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;bar.hidden=true;});};
document.getElementById("installX").onclick=function(){bar.hidden=true;};
addEventListener("appinstalled",function(){bar.hidden=true;});})();
</script>
